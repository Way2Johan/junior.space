<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple calculator built with JavaScript — a JUNIOR.SPACE mini-project.">
  <title>Calculator | JUNIOR.SPACE</title>
  <link rel="icon" type="image/x-icon" href="olp/logo5.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --text: #101828;
      --muted: #667085;
      --line: #e4e7ec;
      --primary: #3157d5;
      --primary-dark: #203da5;
      --accent: #15a37b;
      --dark: #0b1220;
      --shadow: 0 18px 50px rgba(16, 24, 40, .09);
      --danger: #d92d20;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }

    .container { width: min(1160px, calc(100% - 40px)); margin: auto; }

    /* Minimal top bar */
    .topbar {
      background: rgba(255,255,255,.86);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(228,231,236,.8);
    }
    .topbar-inner {
      min-height: 64px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand {
      font-family: "Space Grotesk", sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -.04em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand .back { color: var(--muted); font-size: 1.1rem; transition: .2s ease; }
    .brand .back:hover { color: var(--primary); }
    .brand span { color: var(--primary); }

    /* Page */
    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 70px 20px 90px;
    }

    .calc-card {
      width: 320px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 26px;
      box-shadow: var(--shadow);
      padding: 26px;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      padding: 6px 12px;
      border-radius: 999px;
      background: #eef2ff;
      color: var(--primary);
      font-size: .72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .calc-card h1 {
      margin-top: 14px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 1.5rem;
      letter-spacing: -.03em;
    }
    .calc-card p.sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: .85rem;
    }

    #calc-screen {
      width: 100%;
      margin-top: 22px;
      padding: 18px 14px;
      font-size: 1.6rem;
      font-family: "Space Grotesk", sans-serif;
      text-align: right;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #f9fafb;
      color: var(--text);
      outline: none;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 16px;
    }
    .key {
      border: 0;
      border-radius: 12px;
      padding: 16px 0;
      font-size: 1.1rem;
      font-weight: 700;
      font-family: Inter, sans-serif;
      cursor: pointer;
      background: #f2f4f7;
      color: var(--text);
      transition: .15s ease;
    }
    .key:hover { transform: translateY(-1px); }
    .key:active { transform: translateY(0); }
    .key.op { background: #fff4e8; color: #b54708; }
    .key.equals { background: var(--primary); color: white; grid-column: span 2; }
    .key.equals:hover { background: var(--primary-dark); }
    .key.zero { grid-column: span 2; }

    .clear-btn {
      width: 100%;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      padding: 14px 0;
      font-weight: 800;
      font-size: .95rem;
      background: var(--danger);
      color: white;
      cursor: pointer;
      transition: .2s ease;
    }
    .clear-btn:hover { background: #b42318; }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="compprogram.html"><span class="back">←</span> JUNIOR<span>.SPACE</span></a>
    </div>
  </header>

  <div class="stage">
    <div class="calc-card">
      <span class="badge">Mini project</span>
      <h1>Calculator</h1>
      <p class="sub">Built with plain JavaScript</p>

      <form name="form1" onsubmit="return false;">
        <input id="calc-screen" type="text" name="answer" readonly>

        <div class="keypad">
          <button type="button" class="key" onclick="form1.answer.value += '1'">1</button>
          <button type="button" class="key" onclick="form1.answer.value += '2'">2</button>
          <button type="button" class="key" onclick="form1.answer.value += '3'">3</button>
          <button type="button" class="key op" onclick="form1.answer.value += '+'">+</button>

          <button type="button" class="key" onclick="form1.answer.value += '4'">4</button>
          <button type="button" class="key" onclick="form1.answer.value += '5'">5</button>
          <button type="button" class="key" onclick="form1.answer.value += '6'">6</button>
          <button type="button" class="key op" onclick="form1.answer.value += '-'">−</button>

          <button type="button" class="key" onclick="form1.answer.value += '7'">7</button>
          <button type="button" class="key" onclick="form1.answer.value += '8'">8</button>
          <button type="button" class="key" onclick="form1.answer.value += '9'">9</button>
          <button type="button" class="key op" onclick="form1.answer.value += '*'">×</button>

          <button type="button" class="key" onclick="form1.answer.value += '0'">0</button>
          <button type="button" class="key" onclick="form1.answer.value += '.'">.</button>
          <button type="button" class="key op" onclick="form1.answer.value += '/'">÷</button>
          <button type="button" class="key equals"
            onclick="try { form1.answer.value = String(Function('return (' + form1.answer.value + ')')()); } catch(e) { form1.answer.value = 'Error'; }">=</button>
        </div>

        <button type="button" class="clear-btn" onclick="form1.answer.value = ''">Clear All</button>
      </form>
    </div>
  </div>
</body>
</html>
