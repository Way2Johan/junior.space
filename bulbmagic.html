<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A Magic Bulb mini-project built with HTML, CSS and JavaScript — a JUNIOR.SPACE project.">
  <title>Magic Bulb | JUNIOR.SPACE</title>

  <link rel="icon" type="image/x-icon" href="olp/logo5.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --text: #101828;
      --muted: #667085;
      --line: #e4e7ec;
      --primary: #3157d5;
      --primary-dark: #203da5;
      --shadow: 0 18px 50px rgba(16, 24, 40, .09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background .5s ease;
    }

    body.bulb-on {
      background: #fff9df;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1160px, calc(100% - 40px));
      margin: auto;
    }

    /* TOP BAR */

    .topbar {
      background: rgba(255,255,255,.86);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(228,231,236,.8);
    }

    .topbar-inner {
      min-height: 64px;
      display: flex;
      align-items: center;
    }

    .brand {
      font-family: "Space Grotesk", sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -.04em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand .back {
      color: var(--muted);
      font-size: 1.1rem;
      transition: .2s ease;
    }

    .brand .back:hover {
      color: var(--primary);
    }

    .brand span:last-child {
      color: var(--primary);
    }

    /* MAIN */

    .stage {
      min-height: calc(100vh - 64px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
    }

    .bulb-card {
      width: 390px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 32px;
      text-align: center;
      transition: .4s ease;
    }

    .bulb-card:hover {
      transform: translateY(-4px);
    }

    .badge {
      display: inline-flex;
      padding: 6px 12px;
      border-radius: 999px;
      background: #eef2ff;
      color: var(--primary);
      font-size: .72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    h1 {
      margin-top: 14px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 1.6rem;
      letter-spacing: -.03em;
    }

    .sub {
      margin-top: 7px;
      color: var(--muted);
      font-size: .86rem;
    }

    /* BULB AREA */

    .bulb-area {
      position: relative;
      height: 300px;
      margin-top: 25px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* LIGHT GLOW */

    .light-glow {
      position: absolute;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      background: #ffd84d;
      filter: blur(45px);
      opacity: 0;
      transition: .5s ease;
    }

    .bulb-on .light-glow {
      opacity: .65;
    }

    /* BULB */

    .bulb {
      position: relative;
      z-index: 2;
      width: 115px;
      height: 145px;
      cursor: pointer;
      transition: .3s ease;
    }

    .bulb:hover {
      transform: scale(1.05);
    }

    .bulb-glass {
      position: absolute;
      top: 5px;
      left: 12px;
      width: 91px;
      height: 100px;
      border-radius: 50% 50% 45% 45%;
      background: #d9dee7;
      border: 4px solid #b9c0cc;
      transition: .5s ease;
    }

    .bulb-on .bulb-glass {
      background: #ffe36e;
      border-color: #ffd13b;
      box-shadow:
        0 0 25px #ffd84d,
        0 0 55px #ffd84d,
        0 0 100px rgba(255,216,77,.7);
    }

    /* FILAMENT */

    .filament {
      position: absolute;
      top: 39px;
      left: 39px;
      width: 38px;
      height: 48px;
      border-left: 4px solid #737b89;
      border-right: 4px solid #737b89;
      border-bottom: 4px solid #737b89;
      border-radius: 0 0 50% 50%;
      transition: .4s ease;
    }

    .bulb-on .filament {
      border-color: #ff9f00;
      box-shadow: 0 0 10px #ffb000;
    }

    /* BULB BASE */

    .bulb-base {
      position: absolute;
      bottom: 18px;
      left: 27px;
      width: 61px;
      height: 48px;
      border-radius: 6px 6px 12px 12px;
      background: repeating-linear-gradient(
        to bottom,
        #7c8491 0,
        #7c8491 6px,
        #606875 6px,
        #606875 10px
      );
      transition: .3s ease;
    }

    .bulb-on .bulb-base {
      background: repeating-linear-gradient(
        to bottom,
        #9a8c55 0,
        #9a8c55 6px,
        #74693e 6px,
        #74693e 10px
      );
    }

    /* STATUS */

    .status {
      margin-top: 10px;
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: 1rem;
    }

    .status span {
      color: #d92d20;
      transition: .3s ease;
    }

    .bulb-on .status span {
      color: #15a37b;
    }

    .instruction {
      margin-top: 8px;
      color: var(--muted);
      font-size: .8rem;
    }

    /* BUTTON */

    .switch-btn {
      width: 100%;
      margin-top: 22px;
      border: 0;
      border-radius: 13px;
      padding: 14px;
      background: var(--primary);
      color: white;
      font-family: Inter, sans-serif;
      font-size: .95rem;
      font-weight: 800;
      cursor: pointer;
      transition: .2s ease;
    }

    .switch-btn:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .switch-btn:active {
      transform: translateY(0);
    }

    /* RESPONSIVE */

    @media (max-width: 480px) {
      .bulb-card {
        width: 100%;
        padding: 26px 20px;
      }
    }
  </style>

</head>

<body>

  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="compprogram.html">
        <span class="back">←</span>
        JUNIOR<span>.SPACE</span>
      </a>
    </div>
  </header>

  <main class="stage">

```
<div class="bulb-card">

  <span class="badge">Mini Project</span>

  <h1>Magic Bulb</h1>

  <p class="sub">
    A simple JavaScript light switch
  </p>

  <div class="bulb-area">

    <div class="light-glow"></div>

    <div class="bulb" onclick="toggleBulb()" title="Click the bulb">

      <div class="bulb-glass">
        <div class="filament"></div>
      </div>

      <div class="bulb-base"></div>

    </div>

  </div>

  <div class="status">
    Bulb is <span id="statusText">OFF</span>
  </div>

  <p class="instruction">
    Click the bulb or use the button below
  </p>

  <button class="switch-btn" onclick="toggleBulb()">
    Turn ON / OFF
  </button>

</div>
```

  </main>

  <script>

    function toggleBulb() {

      document.body.classList.toggle("bulb-on");

      const status = document.getElementById("statusText");

      if (document.body.classList.contains("bulb-on")) {
        status.textContent = "ON";
      } else {
        status.textContent = "OFF";
      }

    }

  </script>

</body>
</html>
