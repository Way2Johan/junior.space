  <style>
    :root { --bg:#f6f8fb; --surface:#fff; --text:#101828; --muted:#667085; --line:#e4e7ec; --primary:#3157d5; --primary-dark:#203da5; --accent:#15a37b; --dark:#0b1220; --shadow:0 18px 50px rgba(16,24,40,.09); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:Inter,system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
    a { color:inherit; text-decoration:none; }
    .container { width:min(1160px, calc(100% - 40px)); margin:auto; }
    .navbar { background:rgba(255,255,255,.86); backdrop-filter:blur(16px); border-bottom:1px solid rgba(228,231,236,.8); }
    .nav-inner { min-height:72px; display:flex; align-items:center; justify-content:space-between; }
    .brand { font-family:"Space Grotesk",sans-serif; font-size:1.45rem; font-weight:700; letter-spacing:-.04em; }
    .brand span { color:var(--primary); }
    .stage { flex:1; display:flex; align-items:center; justify-content:center; padding:60px 20px; background:radial-gradient(circle at 80% 20%, rgba(49,87,213,.10), transparent 30%), radial-gradient(circle at 15% 85%, rgba(21,163,123,.08), transparent 28%); }
    .card { text-align:center; max-width:460px; }
    .emoji { font-size:3.4rem; }
    .badge { display:inline-flex; margin-top:14px; padding:7px 12px; border-radius:999px; background:#eef2ff; color:var(--primary); font-size:.78rem; font-weight:800; text-transform:uppercase; letter-spacing:.08em; }
    h1 { margin-top:16px; font-family:"Space Grotesk",sans-serif; font-size:2rem; letter-spacing:-.03em; }
    p { margin-top:12px; color:var(--muted); font-size:1.02rem; }
    .btn { display:inline-flex; margin-top:26px; padding:13px 20px; border-radius:12px; font-weight:700; background:var(--primary); color:#fff; transition:.2s ease; }
    .btn:hover { background:var(--primary-dark); transform:translateY(-2px); }
  </style>
